<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1e1e1e" font-weight="700"><tspan x="40" y="46.4">quantrig — architecture</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" font-weight="700"><tspan x="56" y="99.2">London Strategic Edge</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="56" y="127.0">market data API — your LSE key</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" font-weight="700"><tspan x="416" y="99.2">Browser — React UI</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="416" y="127.0">Chat · Backtest · Data · Settings</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" font-weight="700"><tspan x="916" y="99.2">OpenCode Go</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="916" y="127.0">LLM gateway — your OpenCode key</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057"><tspan x="56" y="783.2">Docker container  ·  compose.yml  ·  published on 127.0.0.1:9000 only  ·  seccomp=unconfined so bubblewrap can create user namespaces</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" font-weight="700"><tspan x="416" y="279.2">quantrig API — Rust · axum</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="416" y="306.9">/api/settings  /api/pairs  /api/datasets</tspan><tspan x="416" y="324.4">/api/run  /api/strategies  /api/conversations</tspan><tspan x="416" y="341.9">/api/chat (SSE)  /api/models  /report/{id}</tspan><tspan x="416" y="359.4"></tspan><tspan x="416" y="376.9">holds both keys · runs the chat agent's tool loop</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" font-weight="700"><tspan x="96" y="509.2">Fetcher — fetch.py</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="96" y="537.0">our code, not the agent's</tspan><tspan x="96" y="554.5">LSE_API_KEY in its environment</tspan><tspan x="96" y="572.0">network: allowed</tspan><tspan x="96" y="589.5">never sees strategy code</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" font-weight="700"><tspan x="876" y="509.2">Sandbox — bubblewrap</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="876" y="537.0">run.py + strategy.py (LLM-written)</tspan><tspan x="876" y="554.5">network: none (--unshare-all)</tspan><tspan x="876" y="572.0">environment cleared — no keys</tspan><tspan x="876" y="589.5">read-only /q · writable /out only</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1e1e1e" font-weight="700"><tspan x="416" y="679.2">./data  →  /data  (volume)</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="416" y="707.0">settings.json (0600) · candles/*.parquet · pairs.json</tspan><tspan x="416" y="724.5">strategies/*.py · runs/&lt;id&gt;/ · conversations/*.json</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="632" y="182.4">HTTP JSON + SSE</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="362" y="462.4">spawns, key via env</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="200" y="340.4">HTTPS</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="936" y="250.4">HTTPS, Bearer key</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="878" y="450.4">bwrap spawn → stats JSON</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="262" y="660.4">writes parquet</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="860" y="660.4">ro-binds strategy + candles</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="860" y="678.4">writes report to runs/&lt;id&gt;</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="632" y="540.4">reads &amp; writes</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" font-weight="700"><tspan x="40" y="842.8">Trust boundary</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="72" y="870.2">holds a credential, may use the network</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="652" y="870.2">runs LLM-written code — no network, no secrets</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="72" y="900.2">the only thing clients talk to</tspan></text>
<text xml:space="preserve" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="652" y="900.2">state on disk, never bound into the sandbox except the files a run needs</tspan></text>
</svg>
