[package]
name = "quantrig"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
jsonwebtoken = "9"
ring = "0.17"
axum = "0.8"
futures-core = "0.3.34"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs"] }
