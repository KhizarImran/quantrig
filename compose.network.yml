services:
  caddy:
    image: caddy:2.11.9-alpine
    depends_on:
      - quantrig
    environment:
      QUANTRIG_HOSTNAME: "${QUANTRIG_HOSTNAME:?Set the HTTPS hostname in .env}"
      QUANTRIG_PASSWORD_HASH: "${QUANTRIG_PASSWORD_HASH:?Set the bcrypt password hash in .env}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
